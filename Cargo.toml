[package]
name = "lazyinstall"
version = "0.1.0"
edition = "2021"
description = "A TUI to track folders holding update scripts and run them, inspired by lazygit"
license = "MIT"
keywords = ["install", "update", "tui", "terminal", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"
